name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - web/**
      - shared/**
      - builder/scripts/download-dictionary.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - vercel.json
      - .vercelignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npx --yes vercel@59.11.2 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@59.11.2 build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx --yes vercel@59.11.2 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
