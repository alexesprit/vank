name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes vercel@59.11.2 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy with latest dictionary release
        run: |
          npx --yes vercel@59.11.2 deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --build-env "DICTIONARY_REPOSITORY=${{ github.repository }}"
