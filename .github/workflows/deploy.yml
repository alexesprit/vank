name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dictionaries_published:
        description: Dictionary release is already published; deploy it as-is
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        if: github.event_name != 'workflow_dispatch' || inputs.dictionaries_published != true
      - name: Download assets already in the current release
        if: github.event_name != 'workflow_dispatch' || inputs.dictionaries_published != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json assets --jq '[.assets[].name]' > "$RUNNER_TEMP/release-assets.json"
          jq -e --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
            [.targets[] | select(.enabled != false and .pack != true) | .asset]
            | all(.[]; . as $asset | $assets[0] | index($asset) != null)
          ' builder/targets.json > /dev/null
          jq --slurpfile assets "$RUNNER_TEMP/release-assets.json" '
            .targets |= with_entries(select(.value.asset as $asset | $assets[0] | index($asset)))
          ' builder/targets.json > "$RUNNER_TEMP/targets.json"
          node --input-type=module -e 'import { downloadDictionaries } from "./builder/scripts/download-dictionary.ts"; await downloadDictionaries(process.argv[1], process.env)' "$RUNNER_TEMP/targets.json"
      - name: Download all assets for an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.dictionaries_published == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --input-type=module -e 'import { downloadDictionaries } from "./builder/scripts/download-dictionary.ts"; await downloadDictionaries("builder/targets.json", process.env)'
      - name: Build configured packs only
        if: github.event_name != 'workflow_dispatch' || inputs.dictionaries_published != true
        run: npm run dict:build -- --pack --no-ai
      - name: Publish packs with the current main dictionary
        if: github.event_name != 'workflow_dispatch' || inputs.dictionaries_published != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run dict:publish -- --no-deploy
      - run: npx --yes vercel@59.11.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel with the latest dictionary release
        run: |
          npx --yes vercel@59.11.2 deploy --prod --token="$VERCEL_TOKEN" \
            --build-env "DICTIONARY_REPOSITORY=${{ github.repository }}"
