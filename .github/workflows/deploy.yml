name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - web/**
      - shared/**
      - builder/scripts/download-dictionary.ts
      - builder/src/targets.ts
      - builder/targets.json
      - package.json
      - package-lock.json
      - tsconfig.json
      - vercel.json
      - .vercelignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes vercel@59.11.2 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy with latest dictionary release
        run: |
          npx --yes vercel@59.11.2 deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --build-env "DICTIONARY_REPOSITORY=${{ github.repository }}"
