name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - web/**
      - shared/**
      - builder/scripts/download-dictionary.ts
      - builder/src/targets.ts
      - builder/targets.json
      - package.json
      - package-lock.json
      - tsconfig.json
      - vercel.json
      - .vercelignore
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes vercel@59.11.2 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Resolve and deploy latest dictionary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api repos/${{ github.repository }}/releases/latest)"
          build_env_args=()
          while IFS=$'\t' read -r target asset; do
            key="$(printf '%s' "$target" | tr '[:lower:]-' '[:upper:]_')"
            asset_data="$(printf '%s' "$release" | jq -r --arg asset "$asset" '[.assets[] | select(.name == $asset)] | if length == 1 then [.[0].browser_download_url, .[0].digest] | @tsv else error("Expected one \($asset) asset") end')"
            IFS=$'\t' read -r url digest <<< "$asset_data"
            [[ "$url" =~ ^https://github\.com/[^[:space:]]+$ ]]
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            build_env_args+=(--build-env "DICTIONARY_URL_${key}=$url")
            build_env_args+=(--build-env "DICTIONARY_SHA256_${key}=${digest#sha256:}")
          done < <(jq -r '.targets | to_entries[] | select(.value.enabled != false) | [.key, .value.asset] | @tsv' builder/targets.json)
          npx --yes vercel@59.11.2 deploy --prod --token=${{ secrets.VERCEL_TOKEN }} "${build_env_args[@]}"
